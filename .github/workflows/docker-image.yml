name: Docker Image CI

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag gabrielfleming/seguranca_docker:${{ github.run_number }}
    - name: Docker Scout
  # You may pin to the exact commit or the version.
  # uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de
      uses: docker/scout-action@v1.18.2
      with:
        command: quickview
        # Image to analyze
        image: gabrielfleming/seguranca_docker:${{ github.run_number }}
        # Ignore vulnerabilities from base image
        ignore-base: false
        # Docker Hub User
        dockerhub-user: $ {{ secrets.DOCKERHUB_USER }}
        # Docker Hub PAT
        dockerhub-password: $ {{ secrets.DOCKERHUB_PASS }}
